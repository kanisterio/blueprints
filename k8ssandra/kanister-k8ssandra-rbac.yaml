apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kanister-operator-cluster-role-k8ssandra
  labels:
    app: kanister-operator
rules:
# Read the CassandraDatacenter that the ActionSet targets
- apiGroups:
  - cassandra.datastax.com
  resources:
  - cassandradatacenters
  verbs:
  - get
# Create, wait on, and delete Medusa backup/restore resources
- apiGroups:
  - medusa.k8ssandra.io
  resources:
  - medusabackupjobs
  - medusabackups
  - medusarestorejobs
  verbs:
  - get
  - create
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kanister-operator-role-k8ssandra
  labels:
    app: kanister-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kanister-operator-cluster-role-k8ssandra
subjects:
- kind: ServiceAccount
  name: kanister-kanister-operator
  namespace: kanister
